name: Firmware de Cooper

on:
  workflow_dispatch:
  push:
    branches:
      - cooper

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cooper (Waveshare 1.85C, español)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compilar
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          python scripts/build.py waveshare/esp32-s3-touch-lcd-1.85c --name esp32-s3-touch-lcd-1.85c --language es-ES

      - name: Subir el firmware
        uses: actions/upload-artifact@v7
        with:
          name: cooper-firmware-1.85c-es
          path: build/merged-binary.bin
          if-no-files-found: error
